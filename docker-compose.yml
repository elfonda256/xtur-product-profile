version: '3.8'

services:
  xtur-product-profile:
    build:
      context: .
      dockerfile: Dockerfile
    image: xtur-product-profile:latest
    container_name: xtur-product-profile
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "coolify.managed=true"
